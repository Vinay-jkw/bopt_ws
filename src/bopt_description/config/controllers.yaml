controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    steering_controller:
      type: position_controllers/JointGroupPositionController

    drive_controller:
      type: velocity_controllers/JointGroupVelocityController

    lift_controller:
      type: position_controllers/JointGroupPositionController

steering_controller:
  ros__parameters:
    joints:
      - drive_wheel_Ass_joint

drive_controller:
  ros__parameters:
    joints:
      - drive_wheel_joint

lift_controller:
  ros__parameters:
    joints:
      - front_lift_joint
