controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    traction_joint_controller:
      type: forward_command_controller/ForwardCommandController

    steering_joint_controller:
      type: position_controllers/JointGroupPositionController

    lift_joint_controller:
      type: joint_trajectory_controller/JointTrajectoryController

traction_joint_controller:
  ros__parameters:
    joints:
      - drive_wheel_joint

    interface_name: velocity


steering_joint_controller:
  ros__parameters:
    joints:
      - drive_wheel_Ass_joint

    interface_name: position


lift_joint_controller:
  ros__parameters:
    joints:
      - front_lift_joint

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    # Trajectory execution settings
    allow_partial_joints_goal: false
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.2   # m/s  — tolerance to consider "stopped"
      goal_time: 5.0                     # seconds — max time to reach goal
      front_lift_joint: {trajectory: 0.05, goal: 0.02}
      front_wheel_shaft_left_joint: {trajectory: 0.3, goal: 0.05}
      front_wheel_shaft_right_joint: {trajectory: 0.3, goal: 0.05}

    # PID gains for the trajectory follower
    gains:
      front_lift_joint:
        p: 50000.0
        i: 100.0
        d: 2000.0
        i_clamp: 1000.0
      
      front_wheel_shaft_left_joint:
        p: 5000.0
        i: 100.0
        d: 500.0
        i_clamp: 1000.0
        # ff_velocity_scale: 1.0
        
      front_wheel_shaft_right_joint:
        p: 5000.0
        i: 100.0
        d: 500.0
        i_clamp: 1000.0
        # ff_velocity_scale: 1.0

