ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    sensor_timeout: 0.1

    map_frame: map
    odom_frame: odom
    base_link_frame: load_wheel_base_link
    world_frame: odom

    odom0: /byd/byd_cpp_odometry
    odom0_config: [
      true,  true,  false,
      false, false, true,
      true,  false, false,
      false, false, true,
      false, false, false
    ]

    imu0: /imu/data
    imu0_config: [
      false, false, false,
      true,  true,  true,
      false, false, false,
      true,  true,  true,
      true,  true,  true
    ]

    imu0_remove_gravitational_acceleration: true
