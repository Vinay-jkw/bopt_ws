# Runtime parameters for the safety_demo node (node name: "safety_node").
#
# Load with:
#   ros2 run safety_demo safety_node_viz \
#       --ros-args --params-file src/safety_demo/config/safety_params.yaml
#
# (run from the workspace root, same as the DB path the node expects)

safety_node:
  ros__parameters:
    scan_threads: 4
    # --- Proximity-based velocity scaling (warning zone) ---
    # In the warning zone the robot slows continuously with how close the nearest
    # obstacle is, instead of a flat 1/3 cut. The closest point across ALL LiDARs
    # drives the multiplier. Danger zones still force a hard stop.
    #
    # The ramp's near/far distances are NOT set here — they are derived per scan from
    # the active policy's field reach (near = danger field reach, far = warning field
    # reach), so the ramp always spans the live warning band for the current speed,
    # direction and sensor:
    #
    #   range <= near (danger edge)   -> factor = min_factor   (slowest)
    #   range >= far  (warning edge)  -> factor = 1.0          (full speed)
    #   in between                    -> linear ramp
    proximity_scaling_enabled: true   # false -> revert to the fixed 1/3 reduction
    proximity_min_factor: 0.15        # slowest multiplier at the danger edge [0..1]

    # --- Velocity source watchdog ---
    # If /velocity or /cmd_vel goes stale for longer than this, the controller emits
    # ZERO instead of re-publishing the last command forever.
    velocity_watchdog_timeout: 0.3    # seconds
