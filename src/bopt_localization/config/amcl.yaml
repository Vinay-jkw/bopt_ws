amcl:
  ros__parameters:

    use_sim_time: true

    alpha1: 0.30
    alpha2: 0.25
    alpha3: 0.15
    alpha4: 0.25

    base_frame_id: "base_footprint"

    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false

    global_frame_id: "map"

    lambda_short: 0.1
    laser_likelihood_max_dist: 2.5

    laser_max_range: 30.0
    laser_min_range: 0.05
    laser_model_type: "likelihood_field"

    max_beams: 180

    max_particles: 3500
    min_particles: 1000

    odom_frame_id: "odom"

    pf_err: 0.05
    pf_z: 0.99

    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001

    resample_interval: 1

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    save_pose_rate: 0.2

    sigma_hit: 0.15

    tf_broadcast: true
    transform_tolerance: 0.5

    update_min_a: 0.01
    update_min_d: 0.01

    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05

    scan_topic: /lidar/top3dl/scan

    set_initial_pose: true

    initial_pose:
      x: 6.83
      y: 10.29
      z: 0.0
      yaw: 3.14159