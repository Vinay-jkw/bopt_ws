costmap/costmap:
  ros__parameters:

    #################################################
    # Costmap
    #################################################

    # Matches /merged_cloud's ~20 Hz publish rate.
    update_frequency: 10.0
    publish_frequency: 10.0

    # global_frame MUST be a fixed frame, not the robot's own moving
    # base frame -- otherwise STVL's temporal persistence has nothing
    # stable to reference. robot_base_frame is the one that should
    # match your actual robot.
    #   odom -> base_footprint -> frame_Lidar_x
    global_frame: odom
    robot_base_frame: base_footprint

    rolling_window: true

    width: 10
    height: 10

    resolution: 0.05

    # BOPT footprint in meters, relative to base_footprint.
    # This polygon is also published on /costmap/published_footprint;
    # voxel_distance_node subscribes to it and excludes voxels inside it.
    # Update these corners if the measured BOPT body dimensions differ.
    footprint: "[ [0.2, 0.65], [0.2, -0.65], [-1.2, -0.65], [-1.75, -0.5], [-1.75, 0.5], [-1.2, 0.65]]"

    plugins:
      - "stvl_layer"
      - "inflation_layer"

    stvl_layer:
      plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
      enabled: true
      voxel_decay: 15.
      decay_model: 0
      voxel_size: 0.05
      track_unknown_space: true
      unknown_threshold: 15
      mark_threshold: 0
      update_footprint_enabled: true
      combination_method: 1
      origin_z: 0.0
      publish_voxel_map: true
      transform_tolerance: 0.2
      mapping_mode: false
      map_save_duration: 60.0

      observation_sources: camera lidar_front lidar_back_left lidar_back_right
      camera:  # no frame set, uses frame from message
        data_type: PointCloud2
        topic: /camera/back/points
        marking: true
        clearing: true
        obstacle_range: 3.0
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        expected_update_rate: 0.0
        observation_persistence: 0.0
        inf_is_valid: false
        filter: "voxel"
        voxel_min_points: 0
        clear_after_reading: true
        max_z: 7.0
        min_z: 0.1
        vertical_fov_angle: 0.8745
        horizontal_fov_angle: 1.048
        decay_acceleration: 15.0
        model_type: 0

      lidar_back_left:
        data_type: LaserScan
        topic: /lidar/left/scan

        # Explicit sensor frame -- avoids frame ambiguity on real,
        # fused multi-LiDAR hardware data.
        # sensor_frame: LLt

        marking: true

        # Still disabled while bringing the real hardware pipeline up --
        # re-enable once /local_costmap/costmap and the voxel grid are
        # both confirmed working correctly.
        clearing: true

        obstacle_range: 5.0
        min_obstacle_height: 0.0
        max_obstacle_height: 1.0
        expected_update_rate: 0.0
        observation_persistence: 0.0
        inf_is_valid: false
        filter: "voxel"
        voxel_min_points: 0
        clear_after_reading: true
        max_z: 7.0
        min_z: 0.1
        vertical_fov_angle: 0.8745
        horizontal_fov_angle: 1.048
        decay_acceleration: 15.0

        # 1 = 3D LiDAR model, matches the fused multi-LiDAR source.
        model_type: 1
      lidar_back_right:
        data_type: LaserScan
        topic: /lidar/right/scan

        # Explicit sensor frame -- avoids frame ambiguity on real,
        # fused multi-LiDAR hardware data.
        # sensor_frame: LRt

        marking: true

        # Still disabled while bringing the real hardware pipeline up --
        # re-enable once /local_costmap/costmap and the voxel grid are
        # both confirmed working correctly.
        clearing: true

        obstacle_range: 5.0
        min_obstacle_height: 0.0
        max_obstacle_height: 1.0
        expected_update_rate: 0.0
        observation_persistence: 0.0
        inf_is_valid: false
        filter: "voxel"
        voxel_min_points: 0
        clear_after_reading: true
        max_z: 7.0
        min_z: 0.1
        vertical_fov_angle: 0.8745
        horizontal_fov_angle: 1.048
        decay_acceleration: 15.0

        # 1 = 3D LiDAR model, matches the fused multi-LiDAR source.
        model_type: 1
      lidar_front:
        data_type: LaserScan
        topic: /lidar/front/scan

        # Explicit sensor frame -- avoids frame ambiguity on real,
        # fused multi-LiDAR hardware data.
        # sensor_frame: toplidar_front

        marking: true

        # Still disabled while bringing the real hardware pipeline up --
        # re-enable once /local_costmap/costmap and the voxel grid are
        # both confirmed working correctly.
        clearing: true

        obstacle_range: 5.0
        min_obstacle_height: 0.0
        max_obstacle_height: 1.0
        expected_update_rate: 0.0
        observation_persistence: 0.0
        inf_is_valid: false
        filter: "voxel"
        voxel_min_points: 0
        clear_after_reading: true
        max_z: 7.0
        min_z: 0.1
        vertical_fov_angle: 0.8745
        horizontal_fov_angle: 1.048
        decay_acceleration: 15.0

        # 1 = 3D LiDAR model, matches the fused multi-LiDAR source.
        model_type: 1

    #################################################
    # Inflation Layer
    #################################################

    inflation_layer:

      plugin: "nav2_costmap_2d::InflationLayer"

      inflation_radius: 0.220 #0.1

      cost_scaling_factor: 1.0
